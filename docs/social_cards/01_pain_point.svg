<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
<title id="title">The rules gain power as their authors disappear</title>
<desc id="desc">Three domains of outsourcing and a matrix showing the absence of architecture-level disclosure across six governance frameworks.</desc>
<rect x="0" y="0" width="900" height="900" rx="0" fill="#F5F2EB" stroke="none" stroke-width="1"/>
<rect x="20" y="18" width="860" height="864" rx="18" fill="#FFFEFB" stroke="#E7E1D7" stroke-width="1"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<text x="52" y="58" font-size="12" fill="#9E3F2E" font-weight="700" text-anchor="start" letter-spacing="1.6">01 · THE PAIN POINT</text>
<text x="52" y="94" font-size="32" fill="#17212B" font-weight="770" text-anchor="start">The rules gain power as</text>
<text x="52" y="132" font-size="32" fill="#17212B" font-weight="770" text-anchor="start">their authors disappear</text>
<text x="52" y="160" font-size="15" fill="#68737D" font-weight="450" text-anchor="start">LLM social simulation moves from commercial experimentation toward public authority.</text>
<text x="52" y="202" font-size="12" fill="#9E3F2E" font-weight="720" text-anchor="start" letter-spacing="1.1">RISING POLITICAL-ECONOMIC &amp; GOVERNANCE STAKES</text>
<polyline points="74,338 338,310 602,270 826,226" fill="none" stroke="#416F75" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="602" y1="270" x2="818.1500094358313" y2="227.54196243224743" stroke="#416F75" stroke-width="5"/><polygon points="826.0,226.0 817.4,223.6 818.9,231.5" fill="#416F75"/>
<circle cx="170" cy="326" r="34" fill="#416F75"/>
<text x="170" y="334" font-size="20" fill="#FFFFFF" font-weight="780" text-anchor="middle">01</text>
<line x1="170" y1="360" x2="170" y2="386" stroke="#416F75" stroke-width="2" stroke-dasharray="3 5"/>
<rect x="62" y="386" width="216" height="112" rx="12" fill="#DDE9E7" stroke="#DED8CF" stroke-width="1"/>
<text x="170" y="420" font-size="12" fill="#416F75" font-weight="760" text-anchor="middle" letter-spacing="1.0">COMMERCIAL</text>
<text x="170" y="462" font-size="24" fill="#17212B" font-weight="770" text-anchor="middle">Proprietary</text>
<circle cx="450" cy="292" r="34" fill="#9E3F2E"/>
<text x="450" y="300" font-size="20" fill="#FFFFFF" font-weight="780" text-anchor="middle">02</text>
<line x1="450" y1="326" x2="450" y2="386" stroke="#9E3F2E" stroke-width="2" stroke-dasharray="3 5"/>
<rect x="342" y="386" width="216" height="112" rx="12" fill="#F2DEDA" stroke="#DED8CF" stroke-width="1"/>
<text x="450" y="420" font-size="12" fill="#9E3F2E" font-weight="760" text-anchor="middle" letter-spacing="1.0">MILITARY</text>
<text x="450" y="462" font-size="24" fill="#17212B" font-weight="770" text-anchor="middle">Classified</text>
<circle cx="720" cy="247" r="34" fill="#D98B3A"/>
<text x="720" y="255" font-size="20" fill="#FFFFFF" font-weight="780" text-anchor="middle">03</text>
<line x1="720" y1="281" x2="720" y2="386" stroke="#D98B3A" stroke-width="2" stroke-dasharray="3 5"/>
<rect x="612" y="386" width="216" height="112" rx="12" fill="#F3E4CF" stroke="#DED8CF" stroke-width="1"/>
<text x="720" y="420" font-size="12" fill="#D98B3A" font-weight="760" text-anchor="middle" letter-spacing="1.0">GOVERNMENTAL</text>
<text x="720" y="462" font-size="24" fill="#17212B" font-weight="770" text-anchor="middle">Undocumented</text>
<line x1="52" y1="530" x2="848" y2="530" stroke="#E5DED3" stroke-width="1"/>
<rect x="52" y="558" width="796" height="220" rx="14" fill="#F7F4EE" stroke="#E5DED3" stroke-width="1"/>
<text x="82" y="596" font-size="12" fill="#9E3F2E" font-weight="750" text-anchor="start" letter-spacing="1.0">THE STRUCTURAL DISCLOSURE GAP</text>
<text x="82" y="688" font-size="72" fill="#9E3F2E" font-weight="790" text-anchor="start">0 / 6</text>
<text x="330" y="622" font-size="22" fill="#17212B" font-weight="730" text-anchor="start">governance frameworks require explicit</text>
<text x="330" y="652" font-size="22" fill="#17212B" font-weight="730" text-anchor="start">procedural authorship disclosure</text>
<text x="330" y="690" font-size="12.5" fill="#68737D" font-weight="550" text-anchor="start">The regulatory object remains the model—not the authored social architecture.</text>
<rect x="330" y="718" width="112" height="38" rx="9" fill="#F2DEDA" stroke="none" stroke-width="1"/>
<text x="345" y="743" font-size="11" fill="#9E3F2E" font-weight="760" text-anchor="start">D1</text>
<text x="372" y="743" font-size="11" fill="#17212B" font-weight="650" text-anchor="start">Topology</text>
<rect x="455" y="718" width="112" height="38" rx="9" fill="#F2DEDA" stroke="none" stroke-width="1"/>
<text x="470" y="743" font-size="11" fill="#9E3F2E" font-weight="760" text-anchor="start">D2</text>
<text x="497" y="743" font-size="11" fill="#17212B" font-weight="650" text-anchor="start">Actions</text>
<rect x="580" y="718" width="112" height="38" rx="9" fill="#F2DEDA" stroke="none" stroke-width="1"/>
<text x="595" y="743" font-size="11" fill="#9E3F2E" font-weight="760" text-anchor="start">D3</text>
<text x="622" y="743" font-size="11" fill="#17212B" font-weight="650" text-anchor="start">Sanctions</text>
<rect x="705" y="718" width="112" height="38" rx="9" fill="#F2DEDA" stroke="none" stroke-width="1"/>
<text x="720" y="743" font-size="11" fill="#9E3F2E" font-weight="760" text-anchor="start">D4</text>
<text x="747" y="743" font-size="11" fill="#17212B" font-weight="650" text-anchor="start">Beneficiary</text>
<line x1="52" y1="818" x2="848" y2="818" stroke="#E7E1D7" stroke-width="1"/>
<text x="52" y="842" font-size="10.5" fill="#68737D" font-weight="400" text-anchor="start">Evidence: institutional gap analysis of six frameworks and three cross-domain cases.</text>
<text x="52" y="864" font-size="10.5" fill="#17212B" font-weight="650" text-anchor="start">Citation: Tang, S. &amp; Lin, Z. (2026). Simulation as Alibi: How the Social Order Gets Outsourced to LLM Agents. AIES ’26.</text>
</g>
