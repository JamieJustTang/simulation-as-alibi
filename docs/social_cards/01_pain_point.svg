<text x="52" y="94" font-size="25" fill="#17212B" font-weight="760" text-anchor="start">The rules gain power as their authors disappear</text>
<text x="52" y="122" font-size="14" fill="#68737D" font-weight="400" text-anchor="start">LLM social simulation is moving from market experimentation toward public authority.</text>
<text x="52" y="157" font-size="11" fill="#9E3F2E" font-weight="700" text-anchor="start" letter-spacing="1.2">RISING POLITICAL-ECONOMIC &amp; GOVERNANCE STAKES</text>
