<text x="52" y="348" font-size="11" fill="#9E3F2E" font-weight="700" text-anchor="start" letter-spacing="1.3">THE DISCLOSURE GAP</text>
<text x="52" y="377" font-size="18" fill="#17212B" font-weight="720" text-anchor="start">None of six frameworks explicitly requires procedural authorship disclosure.</text>
