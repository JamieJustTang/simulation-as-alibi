<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
<title id="title">Emergence hides authorship. UDOS restores it upstream.</title>
<desc id="desc">A mirrored schematic contrasts the Alibi Function, which renders the designer invisible, with UDOS, which creates an upstream auditable record.</desc>
<rect x="0" y="0" width="900" height="900" rx="0" fill="#F5F2EB" stroke="none" stroke-width="1"/>
<rect x="20" y="18" width="860" height="864" rx="18" fill="#FFFEFB" stroke="#E7E1D7" stroke-width="1"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<text x="52" y="58" font-size="12" fill="#9E3F2E" font-weight="700" text-anchor="start" letter-spacing="1.6">03 · MECHANISM + SOLUTION</text>
<text x="52" y="94" font-size="25" fill="#17212B" font-weight="770" text-anchor="start">Emergence hides authorship. UDOS restores it upstream.</text>
<text x="52" y="122" font-size="15" fill="#68737D" font-weight="450" text-anchor="start">Shift accountability from downstream outputs to the design of social architecture.</text>
<rect x="64" y="164" width="344" height="600" rx="16" fill="#FBF4F1" stroke="#DDBDB5" stroke-width="1.5"/>
<rect x="492" y="164" width="344" height="600" rx="16" fill="#F1F7F5" stroke="#BDD4CF" stroke-width="1.5"/>
<text x="236" y="202" font-size="13" fill="#9E3F2E" font-weight="760" text-anchor="middle" letter-spacing="1.0">THE ALIBI FUNCTION</text>
<text x="664" y="202" font-size="13" fill="#416F75" font-weight="760" text-anchor="middle" letter-spacing="1.0">UDOS</text>
<line x1="64" y1="220" x2="408" y2="220" stroke="#DDBDB5" stroke-width="1"/>
<line x1="492" y1="220" x2="836" y2="220" stroke="#BDD4CF" stroke-width="1"/>
<rect x="94" y="246" width="284" height="62" rx="11" fill="#F3E4CF" stroke="#D98B3A" stroke-width="1.5"/>
<text x="236" y="273" font-size="13" fill="#17212B" font-weight="760" text-anchor="middle">EMERGENCE NARRATIVE</text>
<text x="236" y="294" font-size="10.5" fill="#68737D" font-weight="500" text-anchor="middle">social order appears self-organized</text>
<line x1="236" y1="308" x2="236.0" y2="332.0" stroke="#D98B3A" stroke-width="1.8"/><polygon points="236.0,340.0 240.0,332.0 232.0,332.0" fill="#D98B3A"/>
<text x="236" y="360" font-size="10.5" fill="#9E3F2E" font-weight="750" text-anchor="middle" letter-spacing="0.7">THREE REINFORCING MECHANISMS</text>
<rect x="104" y="378" width="264" height="40" rx="9" fill="#F7EAE7" stroke="#DFC0B8" stroke-width="1"/>
<text x="236" y="404" font-size="12" fill="#17212B" font-weight="650" text-anchor="middle">Epistemic laundering</text>
<rect x="104" y="430" width="264" height="40" rx="9" fill="#F7EAE7" stroke="#DFC0B8" stroke-width="1"/>
<text x="236" y="456" font-size="12" fill="#17212B" font-weight="650" text-anchor="middle">Accountability displacement</text>
<rect x="104" y="482" width="264" height="40" rx="9" fill="#F7EAE7" stroke="#DFC0B8" stroke-width="1"/>
<text x="236" y="508" font-size="12" fill="#17212B" font-weight="650" text-anchor="middle">Legitimacy extraction</text>
<line x1="236" y1="522" x2="236.0" y2="544.0" stroke="#9E3F2E" stroke-width="1.8"/><polygon points="236.0,552.0 240.0,544.0 232.0,544.0" fill="#9E3F2E"/>
<rect x="94" y="552" width="284" height="78" rx="11" fill="#F2DEDA" stroke="#9E3F2E" stroke-width="2"/>
<text x="236" y="581" font-size="12" fill="#9E3F2E" font-weight="780" text-anchor="middle">ALIBI EFFECT</text>
<text x="236" y="611" font-size="18" fill="#17212B" font-weight="760" text-anchor="middle">Designer: Invisible</text>
<line x1="112" y1="654" x2="360" y2="654" stroke="#D4B8B0" stroke-width="1" stroke-dasharray="4 5"/>
<text x="236" y="680" font-size="12" fill="#68737D" font-weight="650" text-anchor="middle">Authored procedural architecture</text>
<text x="236" y="703" font-size="10.5" fill="#68737D" font-weight="500" text-anchor="middle">topology · actions · sanctions · beneficiary</text>
<text x="236" y="736" font-size="11.5" fill="#9E3F2E" font-weight="650" text-anchor="middle">Outputs travel; authorship does not.</text>
<text x="450" y="392" font-size="10.5" fill="#D98B3A" font-weight="760" text-anchor="middle" letter-spacing="0.7">SHIFT THE</text>
<text x="450" y="411" font-size="10.5" fill="#D98B3A" font-weight="760" text-anchor="middle" letter-spacing="0.7">REGULATORY</text>
<text x="450" y="430" font-size="10.5" fill="#D98B3A" font-weight="760" text-anchor="middle" letter-spacing="0.7">OBJECT</text>
<line x1="420" y1="454" x2="472.0" y2="454.0" stroke="#D98B3A" stroke-width="2"/><polygon points="480.0,454.0 472.0,450.0 472.0,458.0" fill="#D98B3A"/>
<text x="450" y="478" font-size="10" fill="#68737D" font-weight="600" text-anchor="middle">model-level</text>
<text x="450" y="496" font-size="10" fill="#416F75" font-weight="700" text-anchor="middle">architecture-level</text>
<rect x="522" y="246" width="284" height="52" rx="11" fill="#DDE9E7" stroke="#416F75" stroke-width="1.5"/>
<text x="664" y="278" font-size="13" fill="#17212B" font-weight="760" text-anchor="middle">ARCHITECTURE AUTHOR</text>
<line x1="664" y1="298" x2="664.0" y2="318.0" stroke="#416F75" stroke-width="1.8"/><polygon points="664.0,326.0 668.0,318.0 660.0,318.0" fill="#416F75"/>
<rect x="522" y="326" width="284" height="158" rx="11" fill="#EAF2EF" stroke="#416F75" stroke-width="2"/>
<text x="664" y="354" font-size="12" fill="#416F75" font-weight="780" text-anchor="middle">FOUR UPSTREAM DISCLOSURES</text>
<text x="548" y="382" font-size="11.5" fill="#17212B" font-weight="600" text-anchor="start">R1  Interaction topology</text>
<text x="548" y="405" font-size="11.5" fill="#17212B" font-weight="600" text-anchor="start">R2  Action grammar</text>
<text x="548" y="428" font-size="11.5" fill="#17212B" font-weight="600" text-anchor="start">R3  Sanction architecture</text>
<text x="548" y="451" font-size="11.5" fill="#17212B" font-weight="600" text-anchor="start">R4  Beneficiary structure</text>
<text x="536" y="506" font-size="9.5" fill="#68737D" font-weight="650" text-anchor="start">verification threshold</text>
<text x="792" y="506" font-size="9.5" fill="#68737D" font-weight="650" text-anchor="end">anti-box-ticking</text>
<line x1="664" y1="484" x2="664.0" y2="524.0" stroke="#416F75" stroke-width="1.8"/><polygon points="664.0,532.0 668.0,524.0 660.0,524.0" fill="#416F75"/>
<rect x="522" y="532" width="284" height="54" rx="10" fill="#F8FAF8" stroke="#C9D6D2" stroke-width="1"/>
<text x="664" y="565" font-size="12" fill="#17212B" font-weight="740" text-anchor="middle">INDEPENDENT OVERSIGHT</text>
<line x1="664" y1="586" x2="664.0" y2="606.0" stroke="#416F75" stroke-width="1.8"/><polygon points="664.0,614.0 668.0,606.0 660.0,606.0" fill="#416F75"/>
<rect x="522" y="614" width="284" height="58" rx="10" fill="#F8FAF8" stroke="#C9D6D2" stroke-width="1"/>
<text x="664" y="640" font-size="12" fill="#17212B" font-weight="740" text-anchor="middle">AUDITABLE RECORD</text>
<text x="664" y="659" font-size="10" fill="#68737D" font-weight="500" text-anchor="middle">audit · contestability · liability</text>
<line x1="664" y1="672" x2="664.0" y2="692.0" stroke="#416F75" stroke-width="1.8"/><polygon points="664.0,700.0 668.0,692.0 660.0,692.0" fill="#416F75"/>
<rect x="522" y="700" width="284" height="46" rx="10" fill="#DDE9E7" stroke="#416F75" stroke-width="2"/>
<text x="664" y="729" font-size="13" fill="#416F75" font-weight="780" text-anchor="middle">Designer: Named &amp; Accountable</text>
<line x1="52" y1="818" x2="848" y2="818" stroke="#E7E1D7" stroke-width="1"/>
<text x="52" y="842" font-size="10.5" fill="#68737D" font-weight="400" text-anchor="start">Framework: the Alibi Function and Upstream Disclosure Obligations for Agent Societies (UDOS).</text>
<text x="52" y="864" font-size="10.5" fill="#17212B" font-weight="650" text-anchor="start">Citation: Tang, S. &amp; Lin, Z. (2026). Simulation as Alibi: How the Social Order Gets Outsourced to LLM Agents. AIES ’26.</text>
</g>
</svg>
