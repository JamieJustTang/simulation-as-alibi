<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
<title id="title">Designer erasure concentrates at High EI</title>
<desc id="desc">A three-by-three audit matrix crossing emergence intensity with designer visibility, highlighting High EI and absent designer attribution.</desc>
<rect x="0" y="0" width="900" height="900" rx="0" fill="#F5F2EB" stroke="none" stroke-width="1"/>
<rect x="20" y="18" width="860" height="864" rx="18" fill="#FFFEFB" stroke="#E7E1D7" stroke-width="1"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<text x="52" y="58" font-size="12" fill="#9E3F2E" font-weight="700" text-anchor="start" letter-spacing="1.6">02 · THE AUDIT EVIDENCE · n = 142</text>
<text x="52" y="94" font-size="32" fill="#17212B" font-weight="770" text-anchor="start">Designer erasure concentrates</text>
<text x="52" y="132" font-size="32" fill="#17212B" font-weight="770" text-anchor="start">at High EI</text>
<text x="52" y="160" font-size="15" fill="#68737D" font-weight="450" text-anchor="start">A threshold effect—not a smooth decline in visibility.</text>
<text x="160" y="214" font-size="12" fill="#416F75" font-weight="760" text-anchor="start" letter-spacing="1.0">DESIGNER VISIBILITY (DV)</text>
<text x="230.5" y="244" font-size="12" fill="#416F75" font-weight="760" text-anchor="middle">FULL</text>
<text x="375.5" y="244" font-size="12" fill="#D98B3A" font-weight="760" text-anchor="middle">PARTIAL</text>
<text x="520.5" y="244" font-size="12" fill="#9E3F2E" font-weight="760" text-anchor="middle">ABSENT</text>
<text x="68" y="420" font-size="10.5" fill="#9E3F2E" font-weight="750" text-anchor="middle" letter-spacing="0.7" transform="rotate(-90 68 420)">EMERGENCE INTENSITY (EI)</text>
<text x="146" y="320" font-size="12" fill="#17212B" font-weight="750" text-anchor="end">LOW EI</text>
<rect x="163" y="263" width="135" height="102" rx="11" fill="#DDE9E7" stroke="#DED8CF" stroke-width="1"/>
<text x="230.5" y="306" font-size="30" fill="#17212B" font-weight="790" text-anchor="middle">19</text>
<text x="230.5" y="336" font-size="13" fill="#416F75" font-weight="700" text-anchor="middle">53% of row</text>
<rect x="308" y="263" width="135" height="102" rx="11" fill="#F3E4CF" stroke="#DED8CF" stroke-width="1"/>
<text x="375.5" y="306" font-size="30" fill="#17212B" font-weight="790" text-anchor="middle">15</text>
<text x="375.5" y="336" font-size="13" fill="#D98B3A" font-weight="700" text-anchor="middle">42% of row</text>
<rect x="453" y="263" width="135" height="102" rx="11" fill="#F2DEDA" stroke="#DED8CF" stroke-width="1"/>
<text x="520.5" y="306" font-size="30" fill="#17212B" font-weight="790" text-anchor="middle">2</text>
<text x="520.5" y="336" font-size="13" fill="#9E3F2E" font-weight="700" text-anchor="middle">6% of row</text>
<text x="146" y="432" font-size="12" fill="#17212B" font-weight="750" text-anchor="end">MEDIUM EI</text>
<rect x="163" y="375" width="135" height="102" rx="11" fill="#DDE9E7" stroke="#DED8CF" stroke-width="1"/>
<text x="230.5" y="418" font-size="30" fill="#17212B" font-weight="790" text-anchor="middle">24</text>
<text x="230.5" y="448" font-size="13" fill="#416F75" font-weight="700" text-anchor="middle">49% of row</text>
<rect x="308" y="375" width="135" height="102" rx="11" fill="#F3E4CF" stroke="#DED8CF" stroke-width="1"/>
<text x="375.5" y="418" font-size="30" fill="#17212B" font-weight="790" text-anchor="middle">24</text>
<text x="375.5" y="448" font-size="13" fill="#D98B3A" font-weight="700" text-anchor="middle">49% of row</text>
<rect x="453" y="375" width="135" height="102" rx="11" fill="#F2DEDA" stroke="#DED8CF" stroke-width="1"/>
<text x="520.5" y="418" font-size="30" fill="#17212B" font-weight="790" text-anchor="middle">1</text>
<text x="520.5" y="448" font-size="13" fill="#9E3F2E" font-weight="700" text-anchor="middle">2% of row</text>
<text x="146" y="544" font-size="12" fill="#17212B" font-weight="750" text-anchor="end">HIGH EI</text>
<rect x="163" y="487" width="135" height="102" rx="11" fill="#DDE9E7" stroke="#DED8CF" stroke-width="1"/>
<text x="230.5" y="530" font-size="30" fill="#17212B" font-weight="790" text-anchor="middle">28</text>
<text x="230.5" y="560" font-size="13" fill="#416F75" font-weight="700" text-anchor="middle">49% of row</text>
<rect x="308" y="487" width="135" height="102" rx="11" fill="#F3E4CF" stroke="#DED8CF" stroke-width="1"/>
<text x="375.5" y="530" font-size="30" fill="#17212B" font-weight="790" text-anchor="middle">15</text>
<text x="375.5" y="560" font-size="13" fill="#D98B3A" font-weight="700" text-anchor="middle">26% of row</text>
<rect x="453" y="487" width="135" height="102" rx="11" fill="#F2DEDA" stroke="#9E3F2E" stroke-width="3"/>
<text x="520.5" y="530" font-size="30" fill="#17212B" font-weight="790" text-anchor="middle">14</text>
<text x="520.5" y="560" font-size="13" fill="#9E3F2E" font-weight="700" text-anchor="middle">25% of row</text>
<text x="520.5" y="578" font-size="10" fill="#9E3F2E" font-weight="700" text-anchor="middle">z = +2.7</text>
<rect x="616" y="212" width="232" height="382" rx="15" fill="#F3E8DA" stroke="#E2D4C3" stroke-width="1"/>
<text x="640" y="245" font-size="11" fill="#9E3F2E" font-weight="760" text-anchor="start" letter-spacing="0.9">THE CONCENTRATION</text>
<text x="640" y="330" font-size="58" fill="#9E3F2E" font-weight="800" text-anchor="start">82%</text>
<text x="640" y="370" font-size="17" fill="#17212B" font-weight="700" text-anchor="start">of all absent</text>
<text x="640" y="395" font-size="17" fill="#17212B" font-weight="700" text-anchor="start">designer attribution</text>
<text x="640" y="420" font-size="17" fill="#17212B" font-weight="700" text-anchor="start">occurs in High-EI</text>
<text x="640" y="445" font-size="17" fill="#17212B" font-weight="700" text-anchor="start">papers</text>
<line x1="640" y1="478" x2="824" y2="478" stroke="#D7C2A8" stroke-width="1"/>
<text x="640" y="522" font-size="28" fill="#9E3F2E" font-weight="790" text-anchor="start">14 of 17</text>
<text x="640" y="550" font-size="12" fill="#68737D" font-weight="550" text-anchor="start">absent-DV papers</text>
<text x="640" y="576" font-size="12" fill="#68737D" font-weight="550" text-anchor="start">are High EI</text>
<rect x="52" y="630" width="796" height="166" rx="14" fill="#F7F5EF" stroke="#E2DDD4" stroke-width="1"/>
<text x="76" y="660" font-size="12" fill="#9E3F2E" font-weight="760" text-anchor="start" letter-spacing="1.0">THRESHOLD, NOT GRADIENT</text>
<text x="76" y="708" font-size="23" fill="#17212B" font-weight="780" text-anchor="start">χ² = 16.62</text>
<text x="262" y="708" font-size="23" fill="#17212B" font-weight="780" text-anchor="start">p = .002</text>
<text x="407" y="708" font-size="23" fill="#17212B" font-weight="780" text-anchor="start">V = .242</text>
<text x="558" y="708" font-size="23" fill="#17212B" font-weight="780" text-anchor="start">r = −.141</text>
<text x="76" y="742" font-size="12" fill="#416F75" font-weight="650" text-anchor="start">Significant categorical association</text>
<text x="558" y="742" font-size="12" fill="#68737D" font-weight="650" text-anchor="start">Ordinal correlation is not (p = .094)</text>
<text x="76" y="774" font-size="12.5" fill="#9E3F2E" font-weight="680" text-anchor="start">High EI is the regime where absent designer attribution departs sharply from expectation.</text>
<line x1="52" y1="818" x2="848" y2="818" stroke="#E7E1D7" stroke-width="1"/>
<text x="52" y="842" font-size="10.5" fill="#68737D" font-weight="400" text-anchor="start">Data: 142 LLM social simulation papers; cells show counts and row percentages.</text>
<text x="52" y="864" font-size="10.5" fill="#17212B" font-weight="650" text-anchor="start">Citation: Tang, S. &amp; Lin, Z. (2026). Simulation as Alibi: How the Social Order Gets Outsourced to LLM Agents. AIES ’26.</text>
</g>
</svg>
